<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>えいごゲームひろば | 3〜6年生 英語ゲームアプリ</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "M PLUS Rounded 1c", "Yu Gothic", sans-serif;
  background: linear-gradient(160deg, #fef6e4 0%, #e9f7ff 50%, #f3ecff 100%);
  min-height: 100vh;
  color: #33313f;
}
#app { max-width: 720px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
button { font-family: inherit; cursor: pointer; }

.screen { padding: 12px 16px 24px; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 2px 18px; }
.topbar-title { font-size: 1.25rem; font-weight: 800; color: #4a3f7a; }
.back-btn {
  border: none; background: #fff; border-radius: 999px; padding: 8px 14px;
  font-weight: 700; font-size: .9rem; color: #6a5acd; box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

/* ---------- Home ---------- */
.home-screen { padding-top: 24px; text-align: center; }
.app-title { font-size: 1.8rem; font-weight: 900; color: #4a3f7a; margin-bottom: 6px; }
.app-subtitle { font-size: 1rem; color: #7c7492; margin-bottom: 20px; }
.grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grade-card {
  border-radius: 22px; padding: 26px 10px; color: #fff; font-weight: 800;
  box-shadow: 0 6px 14px rgba(0,0,0,.15); transition: transform .12s ease;
}
.grade-card:active { transform: scale(.96); }
.grade-num { font-size: 1.3rem; margin-bottom: 6px; }
.grade-book { font-size: .85rem; opacity: .92; font-weight: 600; }

/* ---------- Unit list ---------- */
.unit-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.unit-card {
  background: #fff; border-radius: 18px; padding: 14px 18px; box-shadow: 0 3px 10px rgba(0,0,0,.08);
  border-left: 8px solid #ffb26b; transition: transform .12s ease;
}
.unit-card:active { transform: scale(.98); }
.unit-no { font-size: .78rem; font-weight: 800; color: #ff8a5c; letter-spacing: .05em; }
.unit-title { font-size: 1.15rem; font-weight: 800; color: #3d3455; margin-top: 2px; }
.unit-subtitle { font-size: .85rem; color: #8b8398; margin-top: 2px; }

/* ---------- Unit detail ---------- */
.unit-detail-subtitle { color: #7c7492; margin: -8px 0 18px 2px; font-size: .95rem; }
.section-label { font-weight: 800; color: #4a3f7a; margin: 18px 2px 10px; font-size: 1.02rem; }
.words-preview { margin-bottom: 6px; }
.word-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
.word-chip {
  background: #fff; border-radius: 14px; padding: 8px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.07);
  display: flex; flex-direction: column; align-items: flex-start; min-width: 78px;
  font-weight: 700; color: #3d3455; font-size: .92rem;
}
.word-chip-ja { font-size: .74rem; color: #9b93ac; font-weight: 500; }

.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.game-card {
  background: #fff; border-radius: 18px; padding: 16px 8px; text-align: center;
  border: 3px solid #eee; box-shadow: 0 3px 10px rgba(0,0,0,.06); transition: transform .12s ease;
}
.game-card:active { transform: scale(.95); }
.game-icon { font-size: 1.8rem; }
.game-name { font-weight: 800; font-size: .88rem; margin-top: 6px; color: #3d3455; }

/* ---------- Common game elements ---------- */
.game-root { padding-top: 4px; }
.quiz-title { font-weight: 800; color: #4a3f7a; font-size: 1.05rem; margin-bottom: 6px; text-align: center; }
.progress-label { text-align: center; color: #9b93ac; font-size: .85rem; margin-bottom: 14px; }
.big-word { font-size: 1.9rem; font-weight: 900; color: #2f2a45; text-align: center; margin: 10px 0; }
.ja-prompt { color: #4a3f7a; }
.ja-hint { text-align: center; color: #7c7492; font-size: 1rem; margin-bottom: 10px; }
.prompt-box { text-align: center; margin-bottom: 16px; }
.replay-btn {
  border: none; background: #fff4e0; color: #d98324; font-weight: 800; padding: 8px 16px;
  border-radius: 999px; font-size: .95rem; box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

.btn {
  border: none; border-radius: 14px; padding: 12px 18px; font-weight: 800; font-size: 1rem;
  box-shadow: 0 3px 8px rgba(0,0,0,.1); transition: transform .1s ease;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: #6a5acd; color: #fff; }
.btn-secondary { background: #fff; color: #6a5acd; border: 2px solid #e2ddf7; }
.row-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.option-btn { background: #fff; color: #3d3455; border: 2px solid #e2ddf7; padding: 16px 8px; font-size: 1rem; }
.option-btn.correct { background: #d7f5da; border-color: #4caf50; color: #2e7d32; }
.option-btn.wrong { background: #fde3e3; border-color: #e57373; color: #c62828; }

.spk-btn {
  border: none; background: #6a5acd; color: #fff; width: 44px; height: 44px; border-radius: 50%;
  font-size: 1.2rem; margin-top: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.15);
}

.score-box { text-align: center; padding: 40px 10px; }
.score-emoji { font-size: 3.4rem; margin-bottom: 12px; }
.score-text { font-size: 1.3rem; font-weight: 800; color: #4a3f7a; margin-bottom: 22px; }

/* ---------- Flashcard ---------- */
.game-flashcard { display: flex; flex-direction: column; align-items: center; }
.flip-card { width: 260px; height: 180px; perspective: 1000px; margin: 10px 0; }
.flip-card-inner {
  position: relative; width: 100%; height: 100%; text-align: center; transition: transform .5s;
  transform-style: preserve-3d;
}
.flip-card.flipped .flip-card-inner, .flip-card-inner { }
.flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
.flip-card-face {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
  border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(0,0,0,.12);
}
.flip-front { background: #fff; }
.flip-back { background: #6a5acd; color: #fff; transform: rotateY(180deg); }
.flip-back .big-word { color: #fff; }

/* ---------- Spell / sentence tiles ---------- */
.spell-answer-row, .sentence-answer-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 52px; margin: 14px 0 10px; }
.spell-slot {
  width: 38px; height: 44px; border-bottom: 3px solid #6a5acd; display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; font-weight: 800; color: #2f2a45;
}
.spell-letters-row, .sentence-word-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
.letter-tile, .word-tile {
  border: none; background: #fff; border: 2px solid #e2ddf7; border-radius: 12px; padding: 10px 14px;
  font-weight: 800; font-size: 1.1rem; color: #3d3455; box-shadow: 0 2px 6px rgba(0,0,0,.06);
}
.letter-tile.used, .word-tile.used { opacity: .25; pointer-events: none; }
.sentence-chip {
  background: #6a5acd; color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 700;
}
.sentence-placeholder { color: #b8b1cc; font-size: .9rem; }
.sentence-answer-row { border: 2px dashed #cfc7ea; border-radius: 14px; padding: 8px; }

/* ---------- Memory ---------- */
.memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.memory-card { aspect-ratio: 1; perspective: 800px; }
.memory-card-inner { position: relative; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
.memory-card.flipped .memory-card-inner, .memory-card.matched .memory-card-inner { transform: rotateY(180deg); }
.memory-face {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px;
  font-weight: 800; font-size: .82rem; box-shadow: 0 2px 6px rgba(0,0,0,.1);
}
.memory-back { background: #ffd97d; font-size: 1.4rem; }
.memory-front { background: #fff; color: #3d3455; transform: rotateY(180deg); }
.memory-card.matched .memory-face { opacity: .55; }

/* ---------- Time attack ---------- */
.timeattack-header { display: flex; justify-content: space-between; font-weight: 800; color: #4a3f7a; margin-bottom: 8px; font-size: 1.05rem; }

/* ---------- Pronounce ---------- */
.game-pronounce { display: flex; flex-direction: column; align-items: center; }
.mic-btn { margin-top: 10px; }
.pronounce-result { margin-top: 14px; text-align: center; color: #4a3f7a; font-weight: 600; min-height: 30px; }

/* ---------- Bingo ---------- */
.bingo-call { text-align: center; font-size: 1.05rem; font-weight: 800; color: #4a3f7a; margin-bottom: 10px; min-height: 28px; }
.bingo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.bingo-cell {
  background: #fff; border: 2px solid #e2ddf7; border-radius: 12px; aspect-ratio: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 800; font-size: .82rem; color: #3d3455; text-align: center; padding: 4px;
}
.bingo-ja { font-size: .68rem; color: #9b93ac; font-weight: 500; }
.bingo-cell.marked { background: #ffe08a; border-color: #f5b942; }
.bingo-status { text-align: center; font-weight: 800; color: #e07a1f; font-size: 1.15rem; margin: 10px 0; }

/* ---------- Flash feedback overlay ---------- */
.flash-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 999; animation: flashfade .45s ease forwards;
}
.flash-ok { background: rgba(76,175,80,.18); }
.flash-ng { background: rgba(229,115,115,.18); }
@keyframes flashfade { from { opacity: 1; } to { opacity: 0; } }

@media (max-width: 380px) {
  .grade-grid { gap: 10px; }
  .options-grid { grid-template-columns: 1fr; }
}

</style>
</head>

// ---------- 音声読み上げ ----------
let VOICES = [];
function loadVoices() {
  VOICES = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, lang) {
  lang = lang || "en-US";
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.9;
  const v = VOICES.find(v => v.lang === lang) || VOICES.find(v => v.lang && v.lang.startsWith(lang.slice(0,2)));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

// ---------- ユーティリティ ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function speakerBtn(text, lang) {
  const b = el("button", "spk-btn", "🔊");
  b.setAttribute("aria-label", "listen");
  b.onclick = (ev) => { ev.stopPropagation(); speak(text, lang); };
  return b;
}
function playCorrect() { flashResult(true); }
function playWrong() { flashResult(false); }
function flashResult(ok) {
  const flash = el("div", "flash-overlay " + (ok ? "flash-ok" : "flash-ng"));
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 450);
}

// ============================================================
// 1. たんごカード (Flashcard)
// ============================================================
function renderFlashcard(root, unit) {
  const words = unit.words;
  let i = 0;
  const wrap = el("div", "game-flashcard");
  root.appendChild(wrap);

  function draw() {
    wrap.innerHTML = "";
    const [en, ja] = words[i];
    const card = el("div", "flip-card");
    const inner = el("div", "flip-card-inner");
    const front = el("div", "flip-card-face flip-front");
    front.appendChild(el("div", "big-word", en));
    front.appendChild(speakerBtn(en));
    const back = el("div", "flip-card-face flip-back", `<div class="big-word">${ja}</div>`);
    inner.appendChild(front); inner.appendChild(back);
    card.appendChild(inner);
    card.onclick = (e) => {
      if (e.target.closest(".spk-btn")) return;
      card.classList.toggle("flipped");
    };
    wrap.appendChild(card);
    wrap.appendChild(el("div", "progress-label", `${i + 1} / ${words.length}`));

    const nav = el("div", "row-buttons");
    const prev = el("button", "btn btn-secondary", "◀ まえ");
    prev.onclick = () => { i = (i - 1 + words.length) % words.length; draw(); };
    const speakBtn = el("button", "btn btn-secondary", "🔊 きく");
    speakBtn.onclick = () => speak(en);
    const next = el("button", "btn btn-primary", "つぎ ▶");
    next.onclick = () => { i = (i + 1) % words.length; draw(); };
    nav.appendChild(prev); nav.appendChild(speakBtn); nav.appendChild(next);
    wrap.appendChild(nav);
    speak(en);
  }
  draw();
}

// 3. いみあてクイズ (日本語を見て英語を選ぶ)
// ============================================================
function renderMeaning(root, unit) {
  renderChoiceQuiz(root, unit, {

  });

// 共通の4択クイズエンジン
function renderChoiceQuiz(root, unit, cfg) {
  const words = unit.words;
  const total = Math.min(10, words.length);
  const quizWords = sample(words, total);
  let i = 0, score = 0;
  const wrap = el("div", "game-quiz");
  root.appendChild(wrap);

  function draw() {
    if (i >= quizWords.length) {
      showScore(wrap, score, quizWords.length, () => { i = 0; score = 0; draw(); });
      return;
    }
    wrap.innerHTML = "";
    wrap.appendChild(el("div", "quiz-title", cfg.title));
    wrap.appendChild(el("div", "progress-label", `もんだい ${i + 1} / ${quizWords.length}`));
    const [en, ja] = quizWords[i];
    const box = el("div", "prompt-box", cfg.prompt(en, ja));
    wrap.appendChild(box);
    if (cfg.onPromptRender) cfg.onPromptRender(box, en, ja);

    const options = shuffle(cfg.getOptions(quizWords[i], words));
    const optWrap = el("div", "options-grid");
    options.forEach(opt => {
      const b = el("button", "btn option-btn", opt);
      b.onclick = () => {
        if (cfg.onOptionClick) cfg.onOptionClick(opt);
        const correct = opt === cfg.answerOf(quizWords[i]);
        [...optWrap.children].forEach(c => c.disabled = true);
        b.classList.add(correct ? "correct" : "wrong");
        if (correct) { score++; playCorrect(); }
        else {
          playWrong();
          [...optWrap.children].find(c => c.textContent === cfg.answerOf(quizWords[i]))?.classList.add("correct");
        }
        setTimeout(() => { i++; draw(); }, 900);
      };
      optWrap.appendChild(b);
    });
    wrap.appendChild(optWrap);
  }
  draw();
}

function showScore(wrap, score, total, onRetry) {
  wrap.innerHTML = "";
  const box = el("div", "score-box");
  const pct = Math.round((score / total) * 100);
  const emoji = pct === 100 ? "🏆" : pct >= 70 ? "🎉" : pct >= 40 ? "👍" : "💪";
  box.appendChild(el("div", "score-emoji", emoji));
  box.appendChild(el("div", "score-text", `${score} / ${total} 問正解!`));
  const retry = el("button", "btn btn-primary", "もういちど");
  retry.onclick = onRetry;
  box.appendChild(retry);
  wrap.appendChild(box);
}

// ============================================================
// 4. スペルならべかえ
// ============================================================
function renderSpell(root, unit) {
  const words = unit.words.filter(w => /^[A-Za-z ]+$/.test(w[0]) && w[0].replace(/\s/g,"").length <= 12);
  const pool = words.length ? words : unit.words;
  const total = Math.min(8, pool.length);
  const quizWords = sample(pool, total);
  let i = 0, score = 0;
  const wrap = el("div", "game-spell");
  root.appendChild(wrap);

  function draw() {
    if (i >= quizWords.length) { showScore(wrap, score, quizWords.length, () => { i=0; score=0; draw(); }); return; }
    wrap.innerHTML = "";
    wrap.appendChild(el("div", "quiz-title", "🔤 文字をならべて単語を作ろう"));
    wrap.appendChild(el("div", "progress-label", `もんだい ${i + 1} / ${quizWords.length}`));
    const [en, ja] = quizWords[i];
    const target = en.replace(/\s/g, "").toUpperCase();
    wrap.appendChild(el("div", "big-word ja-prompt", ja));
    const replay = el("button", "btn btn-secondary", "🔊 きく");
    replay.onclick = () => speak(en);
    wrap.appendChild(replay);

    const answerRow = el("div", "spell-answer-row");
    wrap.appendChild(answerRow);
    const letterRow = el("div", "spell-letters-row");
    wrap.appendChild(letterRow);

    let picked = [];
    const letters = shuffle(target.split(""));
    function renderRows() {
      answerRow.innerHTML = "";
      target.split("").forEach((_, idx) => {
        answerRow.appendChild(el("div", "spell-slot", picked[idx] || ""));
      });
      letterRow.innerHTML = "";
      letters.forEach((ltr, idx) => {
        const used = usedIdx.includes(idx);
        const b = el("button", "letter-tile" + (used ? " used" : ""), ltr);
        if (!used) b.onclick = () => {
          picked.push(ltr); usedIdx.push(idx); renderRows();
          if (picked.length === target.length) checkAnswer();
        };
        letterRow.appendChild(b);
      });
    }
    let usedIdx = [];
    renderRows();

    const clearBtn = el("button", "btn btn-secondary", "やりなおす");
    clearBtn.onclick = () => { picked = []; usedIdx = []; renderRows(); };
    wrap.appendChild(clearBtn);

    function checkAnswer() {
      const guess = picked.join("");
      const correct = guess === target;
      if (correct) { score++; playCorrect(); } else { playWrong(); }
      setTimeout(() => { i++; draw(); }, 900);
    }
    speak(en);
  }
  draw();
}

// ============================================================
// 5. しんけいすいじゃく (Memory Match)
// ============================================================
function renderMemory(root, unit) {
  const pairCount = Math.min(6, unit.words.length);
  const pairs = sample(unit.words, pairCount);
  let cards = [];
  pairs.forEach((w, idx) => {
    cards.push({ id: idx, type: "en", text: w[0] });
    cards.push({ id: idx, type: "ja", text: w[1] });
  });
  cards = shuffle(cards);
  let first = null, second = null, matched = 0, lock = false;

  const wrap = el("div", "game-memory");
  wrap.appendChild(el("div", "quiz-title", "🧠 英語とにほんごをそろえよう"));
  const grid = el("div", "memory-grid");
  wrap.appendChild(grid);
  root.appendChild(wrap);

  const cardEls = cards.map((c, idx) => {
    const cardEl = el("div", "memory-card");
    const inner = el("div", "memory-card-inner");
    inner.appendChild(el("div", "memory-face memory-back", "❓"));
    inner.appendChild(el("div", "memory-face memory-front", c.text));
    cardEl.appendChild(inner);
    cardEl.onclick = () => onPick(idx, cardEl, c);
    grid.appendChild(cardEl);
    return cardEl;
  });

  function onPick(idx, cardEl, c) {
    if (lock || cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;
    cardEl.classList.add("flipped");
    if (c.type === "en") speak(c.text);
    if (!first) { first = { idx, cardEl, c }; return; }
    second = { idx, cardEl, c };
    lock = true;
    setTimeout(() => {
      if (first.c.id === second.c.id && first.c.type !== second.c.type) {
        first.cardEl.classList.add("matched");
        second.cardEl.classList.add("matched");
        matched++;
        playCorrect();
        if (matched === pairs.length) {
          setTimeout(() => showScore(wrap, matched, pairs.length, () => { root.innerHTML=""; renderMemory(root, unit); }), 500);
        }
      } else {
        first.cardEl.classList.remove("flipped");
        second.cardEl.classList.remove("flipped");
        playWrong();
      }
      first = null; second = null; lock = false;
    }, 700);
  }
}

// ============================================================
// 6. タイムアタック
// ============================================================
function renderTimeAttack(root, unit) {
  const words = unit.words;
  let score = 0, wrong = 0, timeLeft = 45, timer = null, running = true;
  const wrap = el("div", "game-timeattack");
  root.appendChild(wrap);

  function draw() {
    if (!running) return;
    wrap.innerHTML = "";
    const header = el("div", "timeattack-header");
    header.appendChild(el("div", "ta-timer", `⏱️ ${timeLeft}秒`));
    header.appendChild(el("div", "ta-score", `せいかい: ${score}`));
    wrap.appendChild(header);
    wrap.appendChild(el("div", "quiz-title", "⏱️ 時間内にたくさん正解しよう!"));

    const [en, ja] = words[Math.floor(Math.random() * words.length)];
    wrap.appendChild(el("div", "big-word", en));
    speak(en);
    const options = shuffle([ja, ...sample(words.filter(w => w[1] !== ja), 3).map(w => w[1])]);
    const optWrap = el("div", "options-grid");
    options.forEach(opt => {
      const b = el("button", "btn option-btn", opt);
      b.onclick = () => {
        if (!running) return;
        if (opt === ja) { score++; playCorrect(); } else { wrong++; playWrong(); }
        draw();
      };
      optWrap.appendChild(b);
    });
    wrap.appendChild(optWrap);
  }

  timer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      running = false;
      clearInterval(timer);
      wrap.innerHTML = "";
      const box = el("div", "score-box");
      box.appendChild(el("div", "score-emoji", score >= 15 ? "🏆" : score >= 8 ? "🎉" : "💪"));
      box.appendChild(el("div", "score-text", `せいかい ${score} 回! (まちがい ${wrong} 回)`));
      const retry = el("button", "btn btn-primary", "もういちど");
      retry.onclick = () => { root.innerHTML = ""; renderTimeAttack(root, unit); };
      box.appendChild(retry);
      wrap.appendChild(box);
    } else {
      const t = wrap.querySelector(".ta-timer");
      if (t) t.textContent = `⏱️ ${timeLeft}秒`;
    }
  }, 1000);
  draw();
}

// ============================================================
// 7. あなうめクイズ (Fill in the blank)
// ============================================================
function renderFillBlank(root, unit) {
  const sentences = unit.sentences;
  const total = sentences.length;
  let i = 0, score = 0;
  const order = shuffle(sentences.map((_, idx) => idx));
  const wrap = el("div", "game-fillblank");
  root.appendChild(wrap);

  function pickBlankWord(sentenceWords) {
    // 3文字以上の単語をブランク候補にする
    const candidates = sentenceWords.map((w, idx) => ({ w, idx })).filter(o => o.w.replace(/[.,!?]/g,"").length >= 3);
    if (!candidates.length) return 0;
    return candidates[Math.floor(Math.random() * candidates.length)].idx;
  }

  function draw() {
    if (i >= order.length) { showScore(wrap, score, order.length, () => { i=0; score=0; draw(); }); return; }
    wrap.innerHTML = "";
    wrap.appendChild(el("div", "quiz-title", "✏️ 空らんに入る単語を選ぼう"));
    wrap.appendChild(el("div", "progress-label", `もんだい ${i + 1} / ${order.length}`));
    const [en, ja] = sentences[order[i]];
    const tokens = en.split(" ");
    const blankIdx = pickBlankWord(tokens);
    const answer = tokens[blankIdx].replace(/[.,!?]/g, "");
    const display = tokens.map((t, idx) => idx === blankIdx ? "_____" : t).join(" ");

    wrap.appendChild(el("div", "big-word sentence-blank", display));
    wrap.appendChild(el("div", "ja-hint", ja));
    const replay = el("button", "btn btn-secondary", "🔊 全文をきく");
    replay.onclick = () => speak(en);
    wrap.appendChild(replay);
    speak(en);

    const distractors = sample(unit.words.map(w => w[0]).filter(w => w.toLowerCase() !== answer.toLowerCase() && !w.includes(" ")), 3);
    const options = shuffle([answer, ...distractors]);
    const optWrap = el("div", "options-grid");
    options.forEach(opt => {
      const b = el("button", "btn option-btn", opt);
      b.onclick = () => {
        [...optWrap.children].forEach(c => c.disabled = true);
        const correct = opt.toLowerCase() === answer.toLowerCase();
        b.classList.add(correct ? "correct" : "wrong");
        if (correct) { score++; playCorrect(); } else { playWrong(); }
        setTimeout(() => { i++; draw(); }, 900);
      };
      optWrap.appendChild(b);
    });
    wrap.appendChild(optWrap);
  }
  draw();
}

// ============================================================
// 8. はつおんチャレンジ (Pronunciation)
// ============================================================
function renderPronounce(root, unit) {
  const words = unit.words;
  let i = 0;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const wrap = el("div", "game-pronounce");
  root.appendChild(wrap);

  function normalize(s) { return s.toLowerCase().replace(/[^a-z ]/g, "").trim(); }

  function draw() {
    wrap.innerHTML = "";
    wrap.appendChild(el("div", "quiz-title", "🎤 はつおんチャレンジ"));
    wrap.appendChild(el("div", "progress-label", `${i + 1} / ${words.length}`));
    const [en, ja] = words[i];
    wrap.appendChild(el("div", "big-word", en));
    wrap.appendChild(el("div", "ja-hint", ja));
    const listenBtn = el("button", "btn btn-secondary", "🔊 お手本をきく");
    listenBtn.onclick = () => speak(en);
    wrap.appendChild(listenBtn);

    const resultBox = el("div", "pronounce-result");
    wrap.appendChild(resultBox);

    if (SR) {
      const micBtn = el("button", "btn btn-primary mic-btn", "🎤 話してみる");
      micBtn.onclick = () => {
        resultBox.textContent = "きいています…";
        const rec = new SR();
        rec.lang = "en-US";
        rec.maxAlternatives = 3;
        rec.onresult = (e) => {
          const said = e.results[0][0].transcript;
          const ok = normalize(said).includes(normalize(en)) || normalize(en).includes(normalize(said));
          resultBox.innerHTML = `あなたの発音: <b>${said}</b><br>` + (ok ? "✅ Great! 正しく言えました!" : "🔁 もう一度チャレンジしてみよう");
          if (ok) playCorrect(); else playWrong();
        };
        rec.onerror = () => { resultBox.textContent = "うまく聞き取れませんでした。もう一度どうぞ。"; };
        rec.start();
      };
      wrap.appendChild(micBtn);
    } else {
      resultBox.textContent = "この端末では音声認識が使えないので、お手本を聞いてマネして発音してみよう!";
    }

    const nav = el("div", "row-buttons");
    const prev = el("button", "btn btn-secondary", "◀ まえ");
    prev.onclick = () => { i = (i - 1 + words.length) % words.length; draw(); };
    const next = el("button", "btn btn-primary", "つぎ ▶");
    next.onclick = () => { i = (i + 1) % words.length; draw(); };
    nav.appendChild(prev); nav.appendChild(next);
    wrap.appendChild(nav);
    speak(en);
  }
  draw();
}

// 9. えいぶんパズル (Sentence word order)
// ============================================================
function renderSentence(root, unit) {
  const sentences = unit.sentences.filter(s => s[0].split(" ").length >= 3);
  const pool = sentences.length ? sentences : unit.sentences;
  const total = Math.min(6, pool.length);
  const quiz = sample(pool, total);
  let i = 0, score = 0;
  const wrap = el("div", "game-sentence");
  root.appendChild(wrap);

  function draw() {
    if (i >= quiz.length) { showScore(wrap, score, quiz.length, () => { i=0; score=0; draw(); }); return; }
    wrap.innerHTML = "";
    wrap.appendChild(el("div", "quiz-title", "🧩 単語をならべて英文を作ろう"));
    wrap.appendChild(el("div", "progress-label", `もんだい ${i + 1} / ${quiz.length}`));
    const [en, ja] = quiz[i];
    const target = en.replace(/[.!?]$/, "").split(" ");
    wrap.appendChild(el("div", "ja-hint", ja));
    const replay = el("button", "btn btn-secondary", "🔊 お手本をきく");
    replay.onclick = () => speak(en);
    wrap.appendChild(replay);

    const answerRow = el("div", "sentence-answer-row");
    const wordRow = el("div", "sentence-word-row");
    wrap.appendChild(answerRow);
    wrap.appendChild(wordRow);

    let picked = [];
    let usedIdx = [];
    const scrambled = shuffle(target);

    function renderRows() {
      answerRow.innerHTML = "";
      picked.forEach(w => answerRow.appendChild(el("span", "sentence-chip", w)));
      if (!picked.length) answerRow.appendChild(el("span", "sentence-placeholder", "ここに単語をならべよう"));
      wordRow.innerHTML = "";
      scrambled.forEach((w, idx) => {
        const used = usedIdx.includes(idx);
        const b = el("button", "word-tile" + (used ? " used" : ""), w);
        if (!used) b.onclick = () => {
          picked.push(w); usedIdx.push(idx); renderRows();
          if (picked.length === target.length) checkAnswer();
        };
        wordRow.appendChild(b);
      });
    }
    renderRows();

    const clearBtn = el("button", "btn btn-secondary", "やりなおす");
    clearBtn.onclick = () => { picked = []; usedIdx = []; renderRows(); };
    wrap.appendChild(clearBtn);

    function checkAnswer() {
      const correct = picked.join(" ").toLowerCase() === target.join(" ").toLowerCase();
      if (correct) { score++; playCorrect(); } else { playWrong(); }
      setTimeout(() => { i++; draw(); }, 1000);
    }
    speak(en);
  }
  draw();
}

// ============================================================
// 10. えいごビンゴ
// ============================================================
function renderBingo(root, unit) {
  const size = 9; // 3x3
  const words = sample(unit.words, Math.min(size, unit.words.length));
  while (words.length < size) words.push(words[words.length % unit.words.length]);
  const board = words.slice(0, 9);
  const marked = new Array(9).fill(false);
  let calledOrder = shuffle(board.map((_, idx) => idx));
  let callPos = 0;
  let bingoDone = false;

  const wrap = el("div", "game-bingo");
  wrap.appendChild(el("div", "quiz-title", "🎯 えいごビンゴ！読み上げられた単語をタップしよう"));
  const callBox = el("div", "bingo-call");
  wrap.appendChild(callBox);
  const grid = el("div", "bingo-grid");
  wrap.appendChild(grid);
  const status = el("div", "bingo-status", "");
  wrap.appendChild(status);
  const nextBtn = el("button", "btn btn-primary", "🔊 つぎの単語を読み上げる");
  wrap.appendChild(nextBtn);
  root.appendChild(wrap);

  const lines = [
    [0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]
  ];
  const cellEls = board.map((w, idx) => {
    const c = el("div", "bingo-cell", `<div>${w[0]}</div><div class="bingo-ja">${w[1]}</div>`);
    c.onclick = () => {
      if (bingoDone) return;
      marked[idx] = !marked[idx];
      c.classList.toggle("marked", marked[idx]);
      checkBingo();
    };
    grid.appendChild(c);
    return c;
  });

  function checkBingo() {
    const win = lines.some(line => line.every(idx => marked[idx]));
    if (win && !bingoDone) {
      bingoDone = true;
      status.textContent = "🎉 ビンゴ！おめでとう！";
      playCorrect();
      const retry = el("button", "btn btn-primary", "もういちど");
      retry.onclick = () => { root.innerHTML = ""; renderBingo(root, unit); };
      wrap.appendChild(retry);
    }
  }

  function callNext() {
    if (callPos >= calledOrder.length) {
      callBox.textContent = "ぜんぶ読み上げました！まだの単語をさがしてみよう。";
      callPos = 0;
      calledOrder = shuffle(calledOrder);
      return;
    }
    const idx = calledOrder[callPos++];
    const [en, ja] = board[idx];
    callBox.innerHTML = `よみあげ: <b>${en}</b> (${ja})`;
    speak(en);
  }
  nextBtn.onclick = callNext;
  callNext();
}

  fillblank: renderFillBlank,
  pronounce: renderPronounce,
  sentence: renderSentence,
  bingo: renderBingo
};


// ============================================================
// アプリ本体: 画面遷移・ナビゲーション
// ============================================================

const appRoot = document.getElementById("app");
let state = { grade: null, unit: null, game: null };

function navigate(next) {
  state = Object.assign({}, state, next);
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  appRoot.innerHTML = "";
  if (!state.grade) return renderHome();
  if (!state.unit) return renderUnitList();
  if (!state.game) return renderUnitDetail();
  return renderGameScreen();
}

function topBar(title, onBack) {
  const bar = el("div", "topbar");
  if (onBack) {
    const back = el("button", "back-btn", "← もどる");
    back.onclick = onBack;
    bar.appendChild(back);
  }
  bar.appendChild(el("div", "topbar-title", title));
  return bar;
}

// ---------- ホーム画面: 学年選択 ----------
function renderHome() {
  const wrap = el("div", "screen home-screen");
  wrap.appendChild(el("div", "app-title", "🌟 えいごゲームひろば 🌟"));
  wrap.appendChild(el("div", "app-subtitle", "学年をえらんでね"));
  const grid = el("div", "grade-grid");
  GRADES.forEach(g => {
    const card = el("div", "grade-card");
    card.style.background = g.color;
    card.innerHTML = `<div class="grade-num">${g.label}</div><div class="grade-book">${g.book}</div>`;
    card.onclick = () => navigate({ grade: g.grade, unit: null, game: null });
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  appRoot.appendChild(wrap);
}

// ---------- 単元一覧画面 ----------
function renderUnitList() {
  const g = GRADES.find(x => x.grade === state.grade);
  const wrap = el("div", "screen");
  wrap.appendChild(topBar(`${g.label} - ${g.book}`, () => navigate({ grade: null })));
  const grid = el("div", "unit-grid");
  g.units.forEach(u => {
    const card = el("div", "unit-card");
    card.innerHTML = `<div class="unit-no">Unit ${u.no}</div><div class="unit-title">${u.title}</div><div class="unit-subtitle">${u.subtitle}</div>`;
    card.onclick = () => navigate({ unit: u.id, game: null });
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  appRoot.appendChild(wrap);
}

function findUnit() {
  const g = GRADES.find(x => x.grade === state.grade);
  const u = g.units.find(x => x.id === state.unit);
  return { g, u };
}

// ---------- 単元詳細: ゲーム10種選択 ----------
function renderUnitDetail() {
  const { g, u } = findUnit();
  const wrap = el("div", "screen");
  wrap.appendChild(topBar(`Unit ${u.no}: ${u.title}`, () => navigate({ unit: null })));
  wrap.appendChild(el("div", "unit-detail-subtitle", u.subtitle));

  const wordsPreview = el("div", "words-preview");
  wordsPreview.appendChild(el("div", "section-label", "📖 このユニットの単語・表現"));
  const wordList = el("div", "word-chip-list");
  u.words.forEach(([en, ja]) => {
    const chip = el("div", "word-chip");
    chip.innerHTML = `<span>${en}</span><span class="word-chip-ja">${ja}</span>`;
    chip.onclick = () => speak(en);
    wordList.appendChild(chip);
  });
  wordsPreview.appendChild(wordList);
  wrap.appendChild(wordsPreview);

  wrap.appendChild(el("div", "section-label", "🎮 ゲームをえらぼう（全10種類）"));
  const gameGrid = el("div", "game-grid");
  GAME_TYPES.forEach(gt => {
    const card = el("div", "game-card");
    card.style.borderColor = g.color;
    card.innerHTML = `<div class="game-icon">${gt.icon}</div><div class="game-name">${gt.name}</div>`;
    card.onclick = () => navigate({ game: gt.key });
    gameGrid.appendChild(card);
  });
  wrap.appendChild(gameGrid);
  appRoot.appendChild(wrap);
}

// ---------- ゲーム画面 ----------
function renderGameScreen() {
  const { g, u } = findUnit();
  const gt = GAME_TYPES.find(x => x.key === state.game);
  const wrap = el("div", "screen");
  wrap.appendChild(topBar(`${gt.icon} ${gt.name}`, () => navigate({ game: null })));
  const gameRoot = el("div", "game-root");
  wrap.appendChild(gameRoot);
  appRoot.appendChild(wrap);
  GAME_RENDERERS[state.game](gameRoot, u);
}

render();

</script>
</body>
</html>
