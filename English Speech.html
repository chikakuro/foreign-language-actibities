<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スピーチ名人 3〜6年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ee; --card:#ffffff; --ink:#3a3150; --sub:#857c99; --line:#eee3d3;
  --B:#3d9be9; --Bl:#e6f2fd; --M:#3fae74; --Ml:#e4f6ec; --C:#f08a3c; --Cl:#fdeedf;
  --pri:#7a5cf0; --ok:#2fb36e; --ng:#e85a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6}
.en{font-family:"Nunito","Zen Maru Gothic",sans-serif}
button{font-family:inherit;cursor:pointer;border:none}
#app{max-width:880px;margin:0 auto;padding:16px 16px 60px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.back{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:1.2rem;color:var(--ink)}
.topbar .ttl{font-weight:900;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06);white-space:nowrap}
h1{font-size:1.6rem;font-weight:900;text-align:center;margin:8px 0 4px}
.lead{text-align:center;color:var(--sub);font-size:.95rem;margin-bottom:18px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 14px rgba(80,60,30,.07);margin-bottom:14px}

/* hamburger */
.burger{max-width:420px;margin:6px auto 18px}
.bun{border-radius:60px 60px 14px 14px;padding:14px 16px 10px;color:#fff;text-align:center}
.bun.top{background:var(--B)}
.bun.mid{background:var(--M);border-radius:12px;margin:5px 8px;padding:12px 16px}
.bun.bot{background:var(--C);border-radius:14px 14px 40px 40px}
.bun .k{font-weight:900;font-size:1.15rem}
.bun .s{font-size:.82rem;opacity:.95}

.grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grade{border-radius:22px;padding:22px 12px;color:#fff;text-align:center;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.grade:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.grade .n{font-size:2.6rem;line-height:1}
.grade .b{font-size:.78rem;font-weight:700;opacity:.92;margin-top:6px}
.g5{background:linear-gradient(135deg,#5ec98f,#38a872)}
.g6{background:linear-gradient(135deg,#b07df0,#8a5cdc)}
.g3{background:linear-gradient(135deg,#ff9f73,#f07a45)}
.g4{background:linear-gradient(135deg,#5cc0ff,#2f97e0)}

.unit-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.unit{background:#fff;border-radius:18px;padding:14px 16px;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.06);position:relative;color:var(--ink)}
.unit:active{transform:scale(.98)}
.unit .no{font-size:.75rem;font-weight:900;color:var(--pri);letter-spacing:.06em}
.unit .t{font-size:1.1rem;font-weight:900;margin-top:2px}
.unit .j{font-size:.85rem;color:var(--sub)}
.unit .emo{position:absolute;right:14px;top:12px;font-size:1.7rem}
.unit .stars{font-size:.85rem;margin-top:4px;color:#f5b301;min-height:1.2em}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:#fff;border-radius:14px;padding:9px 12px;font-weight:700;font-size:.88rem;color:var(--sub);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.tab.on{background:var(--pri);color:#fff}
.tab .d{font-size:.7rem;margin-left:3px}

.goal{background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:14px;border-left:6px solid var(--pri)}
.goal b{font-size:1.05rem}
.goal small{display:block;color:var(--sub)}

/* parts */
.part{border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;border:3px solid}
.part.B{background:var(--Bl);border-color:var(--B)}
.part.M{background:var(--Ml);border-color:var(--M)}
.part.C{background:var(--Cl);border-color:var(--C)}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tag{color:#fff;border-radius:10px;padding:2px 10px;font-weight:900;font-size:.9rem}
.B .tag,.tag.B{background:var(--B)} .M .tag,.tag.M{background:var(--M)} .C .tag,.tag.C{background:var(--C)}
.ph .role{font-size:.82rem;color:var(--sub);font-weight:700}
.line{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.75);margin-bottom:6px}
.line .e{font-size:1.12rem;font-weight:800}
.line .jj{font-size:.8rem;color:var(--sub)}
.line.hl{outline:3px solid #ffd54a;background:#fffbe6}
.spk{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:1rem}

.btn{border-radius:14px;padding:12px 18px;font-weight:900;font-size:1rem;background:var(--pri);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e2d8c8}
.btn.red{background:var(--ng)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row.c{justify-content:center}
.note{font-size:.85rem;color:var(--sub)}
.big-msg{text-align:center;font-weight:900;font-size:1.2rem;margin:10px 0}

/* puzzle */
.pz{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.05);border:3px solid transparent}
.pz .e{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.pz .chs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pz .ch{flex:1;min-width:90px;border-radius:10px;padding:8px 4px;font-weight:900;font-size:.85rem;background:#f3eee6;color:var(--sub)}
.pz .ch.B.on{background:var(--B);color:#fff} .pz .ch.M.on{background:var(--M);color:#fff} .pz .ch.C.on{background:var(--C);color:#fff}
.pz.right{border-color:var(--ok)} .pz.wrong{border-color:var(--ng)}

/* make */
.slot{background:rgba(255,255,255,.85);border-radius:12px;padding:10px;margin-bottom:8px}
.slot .lb{font-size:.8rem;font-weight:700;color:var(--sub)}
.slot .fr{font-size:1.1rem;font-weight:800;margin:2px 0 6px}
.slot .fr .bl{display:inline-block;min-width:70px;border-bottom:3px dashed #bbb;color:var(--pri);padding:0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid #e5dccd;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.92rem;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.free{border-style:dashed}
.free-in{width:100%;margin-top:6px;border:2px solid #d9cfee;border-radius:10px;padding:8px 10px;font-size:1rem;font-family:"Nunito",sans-serif;font-weight:700}

/* practice */
.lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lv button{flex:1;min-width:110px;border-radius:12px;padding:9px 6px;font-weight:900;font-size:.85rem;background:#fff;color:var(--sub);box-shadow:0 2px 5px rgba(0,0,0,.06)}
.lv button.on{background:var(--ink);color:#fff}
.hide-e{color:transparent;text-shadow:none;background:repeating-linear-gradient(90deg,#d9d2e6 0 10px,transparent 10px 14px);border-radius:6px}
.rec-box{background:#fff;border-radius:16px;padding:14px;margin-top:12px;text-align:center}
.timer{font-family:"Nunito";font-weight:900;font-size:1.6rem}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;text-align:left}
.bar{height:14px;background:#eee;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
.heard{margin-top:8px;font-size:.9rem;background:#f7f4fb;border-radius:10px;padding:8px;text-align:left;min-height:2em}
.myg{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.myg .chips{margin-top:6px}

/* check */
.ck{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ck .q{flex:1;min-width:200px;font-weight:700}
.ck .q.goalq{color:var(--pri)}
.st{display:flex;gap:2px}
.st button{background:none;font-size:1.6rem;color:#ddd;padding:0 2px}
.st button.on{color:#f5b301}
textarea{width:100%;border:2px solid #e5dccd;border-radius:12px;padding:10px;font-family:inherit;font-size:1rem;min-height:70px}

.phrase{display:grid;grid-template-columns:1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;z-index:50;max-width:90vw;text-align:center}

@media (max-width:520px){ h1{font-size:1.35rem} .line .e{font-size:1.02rem} .grade .n{font-size:2.2rem} }
@media print{
  body{background:#fff}
  .topbar,.tabs,.row,.lv,.rec-box,.no-print,.toast,.spk{display:none!important}
  .card,.part{box-shadow:none;break-inside:avoid}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>

/* ---------------- speech synthesis ---------------- */
const TTS = "speechSynthesis" in window;
let VOICES=[]; function lv(){ VOICES = TTS ? speechSynthesis.getVoices() : []; }
if(TTS){ lv(); speechSynthesis.onvoiceschanged = lv; }
function utter(text){
  const u = new SpeechSynthesisUtterance(text.replace(/___/g,"blank"));
  u.lang="en-US"; u.rate = st.slow ? 0.7 : 0.9;
  const v = VOICES.find(v=>v.lang==="en-US") || VOICES.find(v=>v.lang && v.lang.startsWith("en"));
  if(v) u.voice=v; return u;
}
function speak(text){ if(!TTS) return; speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }
function speakSeq(items, onEach, onDone){
  if(!TTS){ toast("この端末では読み上げが使えません"); return; }
  speechSynthesis.cancel();
  let i=0;
  function next(){
    if(i>=items.length){ onEach && onEach(-1); onDone && onDone(); return; }
    onEach && onEach(i);
    const u = utter(items[i]); u.onend = ()=>{ i++; setTimeout(next, 350); }; u.onerror = u.onend;
    speechSynthesis.speak(u);
  }
  next();
}
function spkBtn(text){ const b=el("button","spk","🔊"); b.setAttribute("aria-label","読み上げ"); b.onclick=(e)=>{e.stopPropagation();speak(text);}; return b; }

/* ---------------- built speech ---------------- */
function slotSentence(slot, val){
  if(slot.f.indexOf("___")<0) return slot.f;
  if(!val) return null;
  if(slot.f==="___" || slot.o.length===0) return val;
  return slot.f.replace("___", val).replace(/\.\.$/, ".").replace(/([!?])\.$/, "$1");
}
function builtSpeech(){
  const u=unit(), r=rec(st.grade,u.n), out={B:[],M:[],C:[]}; let missing=0;
  ORDER.forEach(p=>{
    u.build[p].forEach((s,i)=>{
      const k=p+i; const v = r.free[k] || r.picks[k];
      const sen = slotSentence(s, v);
      if(sen) out[p].push(sen); else { out[p].push(null); missing++; }
    });
  });
  return {out, missing};
}

/* ---------------- render root ---------------- */
function render(){
  if(TTS) speechSynthesis.cancel();
  stopRecog(true);
  const app=document.getElementById("app"); app.innerHTML="";
  if(st.screen==="home") app.appendChild(viewHome());
  else if(st.screen==="units") app.appendChild(viewUnits());
  else app.appendChild(viewUnit());
  window.scrollTo(0,0);
}
function topbar(title, back, right){
  const b=el("div","topbar");
  if(back){ const x=el("button","back","←"); x.setAttribute("aria-label","もどる"); x.onclick=back; b.appendChild(x); }
  b.appendChild(el("div","ttl",title));
  if(right) b.appendChild(right);
  return b;
}
function slowToggle(){
  const s=el("button","pill", st.slow?"🐢 ゆっくり":"🐰 ふつう");
  s.onclick=()=>{ st.slow=!st.slow; s.textContent = st.slow?"🐢 ゆっくり":"🐰 ふつう"; };
  return s;
}
function burger(small){
  const w=el("div","burger");
  ORDER.forEach(p=>{
    const cls = p==="B"?"top":p==="M"?"mid":"bot";
    const d=el("div","bun "+cls, `<div class="k"><span class="en">${PART[p].en}</span>　${PART[p].ja}</div>${small?"":`<div class="s">${PART[p].role}</div>`}`);
    w.appendChild(d);
  });
  return w;
}

/* ---------------- units ---------------- */
function starsOf(g,n){
  const r=SAVE[uid(g,n)]; if(!r||!r.stars) return 0;
  const v=Object.values(r.stars); if(!v.length) return 0;
  return Math.round(v.reduce((a,b)=>a+b,0)/v.length);
}
function viewUnits(){
  const w=el("div");
  w.appendChild(topbar(`${st.grade}年生 ・ 単元をえらぼう`, ()=>{st.screen="home";render();}));
  const list=el("div","unit-list");
  UNITS[st.grade].forEach((u,i)=>{
    const s=starsOf(st.grade,u.n);
    const b=el("button","unit", `<div class="emo">${u.emo}</div><div class="no en">UNIT ${u.n}</div><div class="t en">${esc(u.en)}</div><div class="j">${esc(u.sp)}</div><div class="stars">${s?"★".repeat(s)+"☆".repeat(3-s):""}</div>`);
    b.onclick=()=>{ st.idx=i; st.tab="model"; st.screen="unit"; render(); };
    list.appendChild(b);
  });
  w.appendChild(list);
  return w;
}

/* ---------------- unit ---------------- */
const TABS=[["model","① おてほん"],["puzzle","② なかま分け"],["make","③ つくる"],["practice","④ れんしゅう"],["check","⑤ ふりかえり"]];
function viewUnit(){
  const u=unit(), w=el("div");
  w.appendChild(topbar(`UNIT ${u.n}　${u.en}`, ()=>{st.screen="units";render();}, slowToggle()));
  const g=el("div","goal",`<b>${u.emo} ${esc(u.sp)}</b><small>${esc(u.ja)}</small>`);
  w.appendChild(g);
  const tabs=el("div","tabs");
  const r=rec(st.grade,u.n);
  TABS.forEach(([k,label])=>{
    let done="";
    if(k==="puzzle" && r.puzzle) done="✓";
    if(k==="make" && builtSpeech().missing===0) done="✓";
    if(k==="check" && Object.keys(r.stars).length) done="✓";
    const t=el("button","tab"+(st.tab===k?" on":""), label+(done?`<span class="d">${done}</span>`:""));
    t.onclick=()=>{ st.tab=k; render(); };
    tabs.appendChild(t);
  });
  w.appendChild(tabs);
  const body=el("div");
  ({model:tabModel, puzzle:tabPuzzle, make:tabMake, practice:tabPractice, check:tabCheck})[st.tab](body);
  w.appendChild(body);
  return w;
}
function nextTabBtn(label){
  const i=TABS.findIndex(t=>t[0]===st.tab);
  if(i>=TABS.length-1) return null;
  const b=el("button","btn", label || (TABS[i+1][1]+" へ ▶"));
  b.onclick=()=>{ st.tab=TABS[i+1][0]; render(); };
  return b;
}

/* ② puzzle */
function tabPuzzle(root){
  const u=unit(), r=rec(st.grade,u.n);
  root.appendChild(el("p","note","バラバラになった文を、はじめ・なか・おわりのどこに入るか分けよう。"));
  const items=[]; ORDER.forEach(p=>u.model[p].forEach(([e])=>items.push({e,p})));
  const qs=shuffle(items), ans={}, cards=[];
  qs.forEach((q,i)=>{
    const c=el("div","pz");
    const head=el("div","e en"); head.appendChild(spkBtn(q.e)); head.appendChild(el("span",null,esc(q.e)));
    c.appendChild(head);
    const chs=el("div","chs");
    ORDER.forEach(p=>{
      const b=el("button","ch "+p, `${PART[p].en}<br>${PART[p].ja}`);
      b.onclick=()=>{ ans[i]=p; [...chs.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); c.classList.remove("right","wrong"); };
      chs.appendChild(b);
    });
    c.appendChild(chs); root.appendChild(c); cards.push(c);
  });
  const msg=el("div","big-msg","");
  const row=el("div","row c");
  const chk=el("button","btn ok","こたえあわせ");
  chk.onclick=()=>{
    let ok=0;
    qs.forEach((q,i)=>{ const right=ans[i]===q.p; if(right) ok++; cards[i].classList.toggle("right",right); cards[i].classList.toggle("wrong",!right); });
    if(ok===qs.length){ msg.innerHTML="🎉 ぜんぶ正解! はじめ・なか・おわりがわかったね!"; r.puzzle=true; persist(); }
    else msg.innerHTML=`${ok} / ${qs.length} 正解。赤いわくの文をもう一度考えよう。<br><small class="note">ヒント: はじめ＝あいさつ・話題、おわり＝まとめ・お礼</small>`;
  };
  const again=el("button","btn sub","🔀 もう一回");
  again.onclick=()=>render();
  row.appendChild(chk); row.appendChild(again);
  root.appendChild(row); root.appendChild(msg);
  const nb=nextTabBtn(); if(nb){ const r2=el("div","row c"); r2.appendChild(nb); root.appendChild(r2); }
}

/* ③ make */
function tabMake(root){
  const u=unit(), r=rec(st.grade,u.n);
  root.appendChild(el("p","note","ことばをえらんで、自分のスピーチをつくろう。✏️ で自分のことばも書けるよ。"));
  ORDER.forEach(p=>{
    const box=el("div","part "+p);
    box.appendChild(el("div","ph",`<span class="tag">${PART[p].icon} ${PART[p].en}</span><b>${PART[p].ja}</b><span class="role">${PART[p].role}${p==="M"?"（"+bodyN()+"）":""}</span>`));
    u.build[p].forEach((s,i)=>{
      const k=p+i, sl=el("div","slot");
      sl.appendChild(el("div","lb",esc(s.ja)));
      const fr=el("div","fr en");
      const paint=()=>{
        const v=r.free[k]||r.picks[k];
        if(s.f.indexOf("___")<0){ fr.innerHTML=esc(s.f); return; }
        if(s.f==="___"||s.o.length===0) fr.innerHTML = v?esc(v):`<span class="bl">${esc(s.o.length?"えらぼう":(s.hint||s.f))}</span>`;
        else fr.innerHTML = esc(s.f).replace("___", `<span class="bl">${v?esc(v):"　"}</span>`);
      };
      paint(); sl.appendChild(fr);
      if(s.f.indexOf("___")>=0){
        const chips=el("div","chips");
        const inp=el("input","free-in"); inp.type="text"; inp.autocomplete="off"; inp.spellcheck=false;
        inp.placeholder = (s.f==="___"||s.o.length===0) ? "例: "+(s.hint || (s.o[0]||"")) : "ここに英語を書こう";
        inp.value=r.free[k]||"";
        const hasFreeOnly = s.o.length===0;
        inp.style.display = (hasFreeOnly || r.free[k]) ? "block" : "none";
        s.o.forEach(o=>{
          const c=el("button","chip en"+(!r.free[k]&&r.picks[k]===o?" on":""), esc(o));
          c.onclick=()=>{ r.picks[k]=o; delete r.free[k]; inp.value=""; inp.style.display="none"; persist(); [...chips.children].forEach(x=>x.classList.remove("on")); c.classList.add("on"); paint(); };
          chips.appendChild(c);
        });
        if(!hasFreeOnly){
          const fc=el("button","chip free"+(r.free[k]?" on":""),"✏️ 自分で");
          fc.onclick=()=>{ inp.style.display="block"; inp.focus(); [...chips.children].forEach(x=>x.classList.remove("on")); fc.classList.add("on"); };
          chips.appendChild(fc);
        }
        inp.oninput=()=>{ const v=inp.value.trim(); if(v) r.free[k]=v; else delete r.free[k]; persist(); paint(); };
        sl.appendChild(chips); sl.appendChild(inp);
      }
      box.appendChild(sl);
    });
    root.appendChild(box);
  });
  const row=el("div","row c");
  const chk=el("button","btn","✅ できた!");
  chk.onclick=()=>{
    const {missing}=builtSpeech();
    if(missing){ toast(`まだ空らんが ${missing} こあるよ`); return; }
    st.tab="practice"; render();
  };
  const reset=el("button","btn sub","🧹 リセット");
  reset.onclick=()=>{ r.picks={}; r.free={}; persist(); render(); };
  row.appendChild(chk); row.appendChild(reset);
  root.appendChild(row);
}

/* ④ practice */
let mic={rec:null,chunks:[],url:null,t0:0,timer:null,stream:null};
let recog=null, recogText="", recogOn=false;
function stopRecog(silent){
  if(recog){ try{ recog.onend=null; recog.stop(); }catch(e){} recog=null; }
  recogOn=false;
  if(mic.rec && mic.rec.state==="recording"){ try{ mic.rec.stop(); }catch(e){} }
  if(mic.stream){ mic.stream.getTracks().forEach(t=>t.stop()); mic.stream=null; }
  clearInterval(mic.timer);
}
function words(s){ return (s||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean); }
function tabPractice(root){
  const u=unit(), r=rec(st.grade,u.n), {out,missing}=builtSpeech();
  if(missing){
    root.appendChild(el("div","card","<div class='big-msg'>まず ③ つくる でスピーチを完成させよう</div>"));
    const row=el("div","row c"); const b=el("button","btn","③ つくる へ"); b.onclick=()=>{st.tab="make";render();}; row.appendChild(b); root.appendChild(row);
    return;
  }
  // めあて（予見）
  const myg=el("div","myg",`<b>🎯 今日のめあて</b><span class="note">（1つえらぼう）</span>`);
  const gc=el("div","chips");
  GOALS.forEach(gname=>{
    const c=el("button","chip"+(r.goal===gname?" on":""),gname);
    c.onclick=()=>{ r.goal = r.goal===gname?null:gname; persist(); [...gc.children].forEach(x=>x.classList.toggle("on", x.textContent===r.goal)); };
    gc.appendChild(c);
  });
  myg.appendChild(gc); root.appendChild(myg);

  const lv=el("div","lv");
  ["① ぜんぶ見る","② 最初のことばだけ","③ はじめ・なか・おわりだけ"].forEach((t,i)=>{
    const b=el("button",st.level===i?"on":"",t); b.onclick=()=>{st.level=i;render();}; lv.appendChild(b);
  });
  root.appendChild(lv);
  root.appendChild(el("p","note",["文を見ながら言ってみよう。","最初の2語をヒントに言ってみよう。","わくだけを見て、自分の力で言ってみよう!"][st.level]));

  const lines=[], texts=[];
  ORDER.forEach(p=>{
    const box=el("div","part "+p);
    box.appendChild(el("div","ph",`<span class="tag">${PART[p].icon} ${PART[p].en}</span><b>${PART[p].ja}</b>${st.level===2?`<span class="role">${out[p].length}文 ・ ${PART[p].role}</span>`:""}`));
    out[p].forEach(sen=>{
      texts.push(sen);
      if(st.level===2) return;
      const l=el("div","line");
      l.appendChild(spkBtn(sen));
      let shown = esc(sen);
      if(st.level===1){ const ws=sen.split(" "); shown = esc(ws.slice(0,2).join(" ")) + (ws.length>2?` <span class="hide-e">${esc(ws.slice(2).join(" "))}</span>`:""); }
      l.appendChild(el("div",null,`<div class="e en">${shown}</div>`));
      box.appendChild(l); lines.push(l);
    });
    root.appendChild(box);
  });

  const row=el("div","row c");
  const listen=el("button","btn sub","🔊 自分のスピーチを聞く");
  listen.onclick=()=>speakSeq(texts, i=>lines.forEach((l,k)=>l.classList.toggle("hl",k===i)));
  const print=el("button","btn sub","🖨 スピーチメモを印刷");
  print.onclick=()=>window.print();
  row.appendChild(listen); row.appendChild(print);
  root.appendChild(row);

  // 録音＋聞き取りチェック（遂行）
  const box=el("div","rec-box");
  box.appendChild(el("div",null,"<b>🎙️ 本番れんしゅう</b>"));
  const timer=el("div","timer en","0:00"); box.appendChild(timer);
  const ctrl=el("div","row c"); box.appendChild(ctrl);
  const meter=el("div","meter"); box.appendChild(meter);
  const heard=el("div","heard note","「スタート」をおして、はじめからおわりまで通して話そう。"); box.appendChild(heard);
  const play=el("div","row c"); box.appendChild(play);
  root.appendChild(box);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  if(!SR && !canRec) heard.innerHTML="この端末ではマイク機能が使えません。声に出して練習しよう!";

  function drawMeter(){
    meter.innerHTML="";
    const hw=new Set(words(recogText));
    ORDER.forEach(p=>{
      const target=words(out[p].join(" ")).filter(w=>w.length>1);
      const got=target.filter(w=>hw.has(w)).length;
      const pct=target.length?Math.round(got/target.length*100):0;
      meter.appendChild(el("span","tag "+p,PART[p].en));
      const bar=el("div","bar",`<i style="width:${pct}%;background:var(--${p})"></i>`); meter.appendChild(bar);
      meter.appendChild(el("b","en",(pct>=70?"✓ ":"")+pct+"%"));
    });
  }
  function fin(){
    clearInterval(mic.timer);
    start.disabled=false; stop.disabled=true;
    if(SR){
      drawMeter();
      const hw=new Set(words(recogText)); const parts=ORDER.filter(p=>{ const t=words(out[p].join(" ")).filter(w=>w.length>1); return t.length && t.filter(w=>hw.has(w)).length/t.length>=0.7; });
      heard.innerHTML = (recogText?`<b>聞きとれた英語:</b> <span class="en">${esc(recogText)}</span><br>`:"") +
        (parts.length===3?"🎉 はじめ・なか・おわり、ぜんぶ伝わったよ!":"％が低いところをもう一度練習しよう。（聞きとりは目安です）");
    } else heard.innerHTML="録音をきいて、はじめ・なか・おわりが言えたかたしかめよう。";
  }
  const start=el("button","btn red","● スタート");
  const stop=el("button","btn sub","■ おわり"); stop.disabled=true;
  start.onclick=async ()=>{
    if(TTS) speechSynthesis.cancel();
    recogText=""; meter.innerHTML=""; play.innerHTML="";
    heard.innerHTML="🎤 話してね…";
    start.disabled=true; stop.disabled=false;
    mic.t0=Date.now(); timer.textContent="0:00";
    mic.timer=setInterval(()=>{ const s=Math.floor((Date.now()-mic.t0)/1000); timer.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); },300);
    if(canRec){
      try{
        mic.stream=await navigator.mediaDevices.getUserMedia({audio:true});
        mic.chunks=[]; mic.rec=new MediaRecorder(mic.stream);
        mic.rec.ondataavailable=e=>mic.chunks.push(e.data);
        mic.rec.onstop=()=>{
          if(mic.url) URL.revokeObjectURL(mic.url);
          mic.url=URL.createObjectURL(new Blob(mic.chunks,{type:mic.rec.mimeType||"audio/webm"}));
          play.innerHTML="";
          const pb=el("button","btn sub","▶ 自分の声を聞く"); pb.onclick=()=>new Audio(mic.url).play(); play.appendChild(pb);
          if(mic.stream){ mic.stream.getTracks().forEach(t=>t.stop()); mic.stream=null; }
        };
        mic.rec.start();
      }catch(e){ heard.innerHTML="マイクが使えませんでした。設定でマイクを許可してね。"; }
    }
    if(SR){
      try{
        recog=new SR(); recog.lang="en-US"; recog.continuous=true; recog.interimResults=true; recogOn=true;
        let finalT="";
        recog.onresult=(ev)=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) finalT+=" "+t; else interim+=" "+t; } recogText=(finalT+interim).trim(); heard.innerHTML=`<span class="en">${esc(recogText)}</span>`; drawMeter(); };
        recog.onend=()=>{ if(recogOn){ try{recog.start();}catch(e){} } };
        recog.start();
      }catch(e){}
    }
  };
  stop.onclick=()=>{
    recogOn=false;
    if(recog){ try{ recog.onend=null; recog.stop(); }catch(e){} recog=null; }
    if(mic.rec && mic.rec.state==="recording") mic.rec.stop();
    setTimeout(fin, 400);
  };
  ctrl.appendChild(start); ctrl.appendChild(stop);

  // print memo
  const pm=el("div","print-only card");
  pm.innerHTML=`<h1>${esc(u.sp)}</h1><p class="lead">${st.grade}年 UNIT ${u.n} ${esc(u.en)}　名前（　　　　　　　　）</p>`+
    ORDER.map(p=>`<div class="part ${p}"><div class="ph"><span class="tag">${PART[p].en}</span><b>${PART[p].ja}</b></div>${out[p].map(s=>`<div class="line"><div class="e en">${esc(s)}</div></div>`).join("")}</div>`).join("");
  root.appendChild(pm);

  const nb=nextTabBtn(); if(nb){ const r2=el("div","row c no-print"); r2.appendChild(nb); root.appendChild(r2); }
}

/* ⑤ check（省察） */
function tabCheck(root){
  const u=unit(), r=rec(st.grade,u.n);
  root.appendChild(el("p","note","スピーチをふりかえろう。★をつけてね。"));
  const items=[
    ["B","Beginning（はじめ）で、あいさつと話題が言えた"],
    ["M",`Body（なか）で、くわしく${bodyN()}言えた`],
    ["C","Conclusion（おわり）で、まとめとお礼が言えた"],
    ["voice","大きな声で、はっきり話せた"],
    ["eye","聞く人を見て、笑顔で話せた"]
  ];
  if(r.goal) items.unshift(["goal",`🎯 めあて「${r.goal}」ができた`]);
  items.forEach(([k,q])=>{
    const c=el("div","ck");
    c.appendChild(el("div","q"+(k==="goal"?" goalq":""),esc(q)));
    const s=el("div","st");
    [1,2,3].forEach(n=>{
      const b=el("button",(r.stars[k]||0)>=n?"on":"","★"); b.setAttribute("aria-label",n+"つぼし");
      b.onclick=()=>{ r.stars[k]=n; persist(); [...s.children].forEach((x,i)=>x.classList.toggle("on",i<n)); };
      s.appendChild(b);
    });
    c.appendChild(s); root.appendChild(c);
  });
  const memo=el("div","card");
  memo.appendChild(el("div",null,"<b>📝 次はこうしたい</b>"));
  const ta=document.createElement("textarea"); ta.placeholder="例: おわりで「Let's ～ together!」を入れたい"; ta.value=r.memo||"";
  ta.oninput=()=>{ r.memo=ta.value; persist(); };
  memo.appendChild(ta); root.appendChild(memo);
  const row=el("div","row c");
  const done=el("button","btn ok","できた! 単元一覧へ");
  done.onclick=()=>{ if(!Object.keys(r.stars).length){ toast("★をつけてね"); return; } toast("🌟 おつかれさま!"); st.screen="units"; render(); };
  const again=el("button","btn sub","④ もう一回れんしゅう"); again.onclick=()=>{st.tab="practice";render();};
  row.appendChild(again); row.appendChild(done); root.appendChild(row);
}

render();
</script>
</body>
</html>
