<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スモールトーク れんしゅうノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --paper-line:#E7DCC4;
    --ink:#2C3A45;
    --ink-soft:#5A6B74;
    --coral:#FF6F59;
    --marigold:#FFC145;
    --sky:#3F9BD1;
    --grape:#9D7FE0;
    --mint:#3FAE8C;
    --berry:#E85D75;
    --card-shadow: 0 6px 0 rgba(44,58,69,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
  }
  .en{font-family:'Fredoka',sans-serif;}
  #app{width:100%;max-width:640px;}

  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .back-btn{
    background:none;border:2px solid var(--ink);border-radius:50%;
    width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink);
    flex:none;transition:transform .15s;
  }
  .back-btn:hover{transform:translateX(-2px);}
  .stamp-rail{
    flex:1;min-width:120px;display:flex;gap:5px;background:#fff;border:2px solid var(--ink);
    border-radius:20px;padding:6px 10px;box-shadow:var(--card-shadow);overflow-x:auto;
  }
  .stamp{
    width:22px;height:22px;border-radius:50%;flex:none;
    border:2px dashed #C9BE9E;display:flex;align-items:center;justify-content:center;
    font-size:11px;background:#fff;
  }
  .stamp.done{border-style:solid;border-color:var(--berry);background:#FFEFEA;transform:rotate(-8deg);}
  .slow-toggle{
    flex:none;font-family:'Zen Maru Gothic';font-weight:700;font-size:11.5px;
    border:2px solid var(--ink);border-radius:16px;padding:7px 10px;
    background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:var(--card-shadow);
  }
  .slow-toggle.on{background:var(--grape);color:#fff;}

  h1{font-family:'Fredoka',sans-serif;font-size:28px;margin:0 0 4px;letter-spacing:.5px;}
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0 0 20px;}
  .section-label{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;color:#fff;background:var(--ink);
    padding:4px 12px;border-radius:14px;margin-bottom:12px;
  }
  .book-badge{
    display:inline-block;font-family:'Fredoka';font-size:11.5px;font-weight:600;
    color:var(--coral);border:1.5px solid var(--coral);border-radius:10px;
    padding:2px 8px;margin-bottom:8px;
  }

  .cover{
    background:#fff;border:3px solid var(--ink);border-radius:18px;
    padding:34px 26px;text-align:center;box-shadow:var(--card-shadow);
    position:relative;overflow:hidden;
  }
  .cover::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:var(--marigold);border-radius:50%;opacity:.35;}
  .cover::after{content:"";position:absolute;bottom:-50px;left:-30px;width:160px;height:160px;background:var(--sky);border-radius:50%;opacity:.25;}
  .cover h1{font-size:32px;position:relative;}
  .cover .en-sub{font-family:'Fredoka';color:var(--coral);font-size:15px;font-weight:600;margin-bottom:14px;position:relative;}
  .cover p{color:var(--ink-soft);font-size:14px;line-height:1.7;position:relative;max-width:440px;margin:0 auto 20px;}
  .cover .textbook-line{font-size:12px;color:var(--ink-soft);position:relative;margin-bottom:18px;}
  .big-btn{
    position:relative;font-family:'Zen Maru Gothic';font-weight:700;font-size:17px;
    background:var(--coral);color:#fff;border:3px solid var(--ink);
    border-radius:16px;padding:14px 30px;cursor:pointer;box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s;
  }
  .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}

  .grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grade-card{
    background:#fff;border:3px solid var(--ink);border-radius:16px;padding:20px 10px;
    text-align:center;cursor:pointer;box-shadow:var(--card-shadow);transition:transform .12s;
  }
  .grade-card:hover{transform:translateY(-3px);}
  .grade-card .num{font-family:'Fredoka';font-size:34px;font-weight:700;color:var(--sky);}
  .grade-card .lbl{font-size:13.5px;font-weight:700;margin-top:2px;}
  .grade-card .book{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}

  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .topic-card{
    position:relative;border:3px solid var(--ink);border-radius:16px;
    padding:16px 12px 12px;cursor:pointer;box-shadow:var(--card-shadow);
    background:#fff;transition:transform .15s;
  }
  .topic-card:nth-child(odd){transform:rotate(-2deg);}
  .topic-card:nth-child(even){transform:rotate(2deg);}
  .topic-card:hover{transform:scale(1.04) rotate(0deg);}
  .topic-card.locked{opacity:.45;cursor:not-allowed;}
  .topic-card.locked:hover{transform:none;}
  .tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);width:52px;height:16px;background:rgba(255,193,69,.85);border:1px solid rgba(44,58,69,.15);}
  .topic-card .unum{font-family:'Fredoka';font-size:11px;color:var(--sky);font-weight:700;}
  .topic-card .emoji{font-size:26px;margin-top:2px;}
  .topic-card .t-ja{font-weight:700;font-size:13.5px;margin-top:4px;line-height:1.3;}
  .topic-card .t-en{font-family:'Fredoka';font-size:11px;color:var(--ink-soft);}
  .topic-card .lock-note{font-size:10px;color:var(--berry);margin-top:4px;font-weight:700;}
  .topic-card .done-badge{position:absolute;top:8px;right:8px;background:var(--mint);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;}

  .scene-card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px;box-shadow:var(--card-shadow);}
  .progress-dots{display:flex;gap:6px;margin-bottom:16px;}
  .dot{width:100%;height:6px;border-radius:3px;background:#EAE2CC;}
  .dot.active{background:var(--coral);}
  .dot.past{background:var(--mint);}

  .partner-bubble{background:#F1F6FA;border:2px solid var(--sky);border-radius:16px 16px 16px 4px;padding:14px 16px;margin-bottom:16px;}
  .partner-bubble .who{font-size:11.5px;font-weight:700;color:var(--sky);margin-bottom:4px;}
  .en-row{display:flex;align-items:center;gap:8px;}
  .partner-bubble .en-line{font-family:'Fredoka';font-size:18px;font-weight:600;}
  .partner-bubble .ja-line{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  .speak-btn{
    flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);
    background:#fff;color:var(--ink);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .12s, transform .1s;
  }
  .speak-btn:hover{transform:scale(1.08);}
  .speak-btn.playing{background:var(--marigold);}
  .speak-btn.sm{width:24px;height:24px;font-size:11px;border-width:1.5px;}

  .prompt-note{font-size:12px;font-weight:700;color:var(--ink-soft);margin:6px 0 10px;display:flex;align-items:center;gap:6px;}

  .option-list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .option{
    text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:14px;
    padding:10px 10px 10px 14px;cursor:pointer;transition:background .12s, transform .1s;
    display:flex;align-items:center;gap:10px;justify-content:space-between;
  }
  .option:hover{transform:translateX(3px);}
  .option .txt{flex:1;}
  .option .en-line{font-family:'Fredoka';font-size:15.5px;font-weight:600;}
  .option .ja-line{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .option.chosen{background:var(--marigold);}

  .say-banner{margin-top:14px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between;}
  .say-banner .txt{display:flex;flex-direction:column;gap:2px;}
  .say-banner .en{color:var(--marigold);}
  .say-banner .speak-btn{border-color:#fff;color:#fff;background:transparent;}
  .say-banner .speak-btn.playing{background:var(--marigold);color:var(--ink);border-color:var(--marigold);}

  /* ---- mic recording box ---- */
  .mic-box{margin-top:14px;background:#F7F2FF;border:2px dashed var(--grape);border-radius:14px;padding:12px 14px;}
  .mic-lbl{font-size:11.5px;font-weight:700;color:var(--grape);margin-bottom:8px;}
  .mic-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .mic-btn{
    font-family:'Zen Maru Gothic';font-weight:700;font-size:12.5px;border:2.5px solid var(--ink);
    border-radius:12px;padding:9px 13px;cursor:pointer;background:#fff;color:var(--ink);
    transition:transform .1s;
  }
  .mic-btn:hover{transform:translateY(-1px);}
  .mic-btn.recording{background:var(--berry);color:#fff;border-color:var(--berry);animation:recPulse 1s infinite;}
  @keyframes recPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .mic-btn.play{background:var(--sky);color:#fff;border-color:var(--sky);}
  .mic-btn.compare{background:var(--marigold);color:var(--ink);border-color:var(--marigold);}
  .mic-btn.ghost{background:#fff;color:var(--ink-soft);font-size:11.5px;padding:6px 12px;border-width:1.5px;}
  .mic-timer{font-family:'Fredoka';font-weight:700;color:var(--berry);font-size:14px;}
  .mic-note{font-size:11px;color:var(--berry);font-weight:700;line-height:1.5;}

  .followup-box{margin-top:16px;border-top:2px dashed var(--paper-line);padding-top:14px;}
  .followup-box .lbl{font-size:11.5px;font-weight:700;color:var(--grape);margin-bottom:6px;}
  .followup-box .en-row{display:flex;align-items:center;gap:8px;}
  .followup-box .en-line{font-family:'Fredoka';font-size:14.5px;font-weight:600;}
  .followup-box .ja-line{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .nav-row{display:flex;justify-content:flex-end;margin-top:20px;}
  .next-btn{
    font-family:'Zen Maru Gothic';font-weight:700;font-size:15px;
    background:var(--sky);color:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:11px 22px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s;
  }
  .next-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .next-btn:disabled{opacity:.4;cursor:not-allowed;}

  .no-voice-note{font-size:11.5px;color:var(--berry);font-weight:700;margin-top:8px;}

  .complete-card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:30px 20px;text-align:center;box-shadow:var(--card-shadow);}
  .complete-card .stamp-big{width:90px;height:90px;border-radius:50%;border:4px solid var(--berry);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 16px;transform:rotate(-8deg);color:var(--berry);}
  .complete-card h2{font-family:'Fredoka';margin:0 0 6px;}
  .complete-card p{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .ghost-btn{background:#fff;border:2.5px solid var(--ink);color:var(--ink);border-radius:14px;padding:11px 18px;font-family:'Zen Maru Gothic';font-weight:700;font-size:14px;cursor:pointer;}

  @media (max-width:400px){
    .topic-card .emoji{font-size:22px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- speech (text-to-speech) ---------------- */
const VOICE_OK = ('speechSynthesis' in window);
let playingBtn = null;
function stopSpeak(){ if(VOICE_OK) window.speechSynthesis.cancel(); if(playingBtn){playingBtn.classList.remove('playing'); playingBtn=null;} }
function speak(text, btnEl){
  if(!VOICE_OK) return;
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate = state.slow ? 0.68 : 0.95; u.pitch = 1.05;
  if(btnEl){ btnEl.classList.add('playing'); playingBtn=btnEl; }
  u.onend = ()=>{ if(btnEl) btnEl.classList.remove('playing'); if(playingBtn===btnEl) playingBtn=null; };
  u.onerror = u.onend;
  window.speechSynthesis.speak(u);
}
function speakBtn(text, size){
  const b = el('button','speak-btn'+(size==='sm'?' sm':''), '🔊');
  b.setAttribute('aria-label','きく: '+text);
  b.onclick = (e)=>{ e.stopPropagation(); speak(text, b); };
  return b;
}

/* ---------------- mic recording (record & playback) ---------------- */
const MIC_SUPPORTED = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let micState = {
  recording:false, recorder:null, chunks:[], blobUrl:null, stream:null,
  timerInterval:null, elapsed:0, permissionError:false
};
function formatTime(sec){ const m=Math.floor(sec/60); const s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function resetMic(){
  if(micState.timerInterval) clearInterval(micState.timerInterval);
  if(micState.recorder && micState.recorder.state!=='inactive'){
    try{ micState.recorder.stop(); }catch(e){}
  }
  if(micState.stream){ micState.stream.getTracks().forEach(t=>t.stop()); }
  if(micState.blobUrl){ URL.revokeObjectURL(micState.blobUrl); }
  micState = { recording:false, recorder:null, chunks:[], blobUrl:null, stream:null, timerInterval:null, elapsed:0, permissionError:false };
}
async function startRecording(){
  if(!MIC_SUPPORTED) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    micState.stream = stream;
    micState.chunks = [];
    micState.permissionError = false;
    const mr = new MediaRecorder(stream);
    micState.recorder = mr;
    mr.ondataavailable = e=>{ if(e.data.size>0) micState.chunks.push(e.data); };
    mr.onstop = ()=>{
      const blob = new Blob(micState.chunks, {type: mr.mimeType || 'audio/webm'});
      micState.blobUrl = URL.createObjectURL(blob);
      if(micState.stream){ micState.stream.getTracks().forEach(t=>t.stop()); }
      micState.recording = false;
      if(micState.timerInterval) clearInterval(micState.timerInterval);
      render();
    };
    mr.start();
    micState.recording = true;
    micState.elapsed = 0;
    micState.timerInterval = setInterval(()=>{
      micState.elapsed++;
      const t = document.getElementById('mic-timer');
      if(t) t.textContent = formatTime(micState.elapsed);
      if(micState.elapsed >= 15) stopRecording(); // safety cap
    }, 1000);
    render();
  }catch(err){
    micState.permissionError = true;
    render();
  }
}
function stopRecording(){
  if(micState.recorder && micState.recording){
    try{ micState.recorder.stop(); }catch(e){}
  }
}
function renderMicBox(targetText){
  const box = el('div','mic-box');
  box.appendChild(el('div','mic-lbl','🎧 自分の発音をろくおんして聞いてみよう'));

  if(!MIC_SUPPORTED){
    box.appendChild(el('div','mic-note','⚠️ この端末・ブラウザでは録音機能が使えません。'));
    return box;
  }

  const row = el('div','mic-row');
  if(micState.recording){
    const stopBtn = el('button','mic-btn recording','⏹ 止める');
    stopBtn.onclick = ()=> stopRecording();
    row.appendChild(stopBtn);
    const timer = el('span','mic-timer', formatTime(micState.elapsed));
    timer.id='mic-timer';
    row.appendChild(timer);
  } else {
    const recBtn = el('button','mic-btn','🎙️ ろくおんする');
    recBtn.onclick = ()=> startRecording();
    row.appendChild(recBtn);
  }
  box.appendChild(row);

  if(micState.blobUrl){
    const playRow = el('div','mic-row');
    const playBtn = el('button','mic-btn play','▶️ じぶんの声');
    playBtn.onclick = ()=>{ const a = new Audio(micState.blobUrl); a.play(); };
    const compareBtn = el('button','mic-btn compare','🔊→🎤 きき比べる');
    compareBtn.onclick = ()=>{
      stopSpeak();
      speak(targetText);
      setTimeout(()=>{ const a = new Audio(micState.blobUrl); a.play(); }, 1300);
    };
    playRow.appendChild(playBtn);
    playRow.appendChild(compareBtn);
    box.appendChild(playRow);

    const rerecBtn = el('button','mic-btn ghost','🔁 とりなおす');
    rerecBtn.onclick = ()=>{ resetMic(); render(); };
    box.appendChild(rerecBtn);
  }

  if(micState.permissionError){
    box.appendChild(el('div','mic-note','⚠️ マイクの使用が許可されませんでした。ブラウザのアドレスバーやサイト設定でマイクを「許可」にしてから、もう一度お試しください。'));
  }
  return box;
}

   5年・6年 = NEW HORIZON Elementary 5 / 6 令和6年度版 (東京書籍, 各8ユニット) */

/* ---------------- state ---------------- */
let state = {
  screen:'home',      // home | grade | topics | practice | complete
  grade:null,
  unitIdx:null,
  step:0,
  chosen:null,
  completed:{},        // key `g${grade}u${num}` -> true
  slow:false
};

function unitsForGrade(){ return GRADE_INFO[state.grade].units; }
function unitKey(g,num){ return 'g'+g+'u'+num; }
function completedCountForGrade(){
  return unitsForGrade().filter(u=>state.completed[unitKey(state.grade,u.num)]).length;
}
function isUnitUnlocked(idx){
  return true; // どの単元からでも自由に選べる
}

/* ---------------- render router ---------------- */
function render(){
  stopSpeak();
  if(state.screen !== 'practice') resetMic();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen==='home') app.appendChild(renderHome());
  else if(state.screen==='grade') app.appendChild(renderGrade());
  else if(state.screen==='topics') app.appendChild(renderTopics());
  else if(state.screen==='practice') app.appendChild(renderPractice());
  else if(state.screen==='complete') app.appendChild(renderComplete());
}

function topBar(showBack, onBack, showStamps){
  const bar = el('div','topbar');
  if(showBack){
    const b = el('button','back-btn','←');
    b.onclick = onBack;
    bar.appendChild(b);
  }
  if(showStamps && state.grade){
    const rail = el('div','stamp-rail');
    unitsForGrade().forEach(u=>{
      const done = state.completed[unitKey(state.grade,u.num)];
      const s = el('div','stamp'+(done?' done':''), done?'★':'');
      rail.appendChild(s);
    });
    bar.appendChild(rail);
  } else {
    bar.appendChild(el('div','stamp-rail'));
  }
  const slowBtn = el('button','slow-toggle'+(state.slow?' on':''), state.slow?'🐢 ゆっくり':'🐰 ふつう');
  slowBtn.onclick = ()=>{ state.slow = !state.slow; render(); };
  bar.appendChild(slowBtn);
  return bar;
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text!==undefined) e.textContent = text;
  return e;
}

function voiceNote(){
  if(VOICE_OK) return null;
  return el('div','no-voice-note','⚠️ このブラウザでは音声のよみあげが使えません。');
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const wrap = document.createElement('div');
  wrap.appendChild(topBar(false, null, false));
  const cover = el('div','cover');
  cover.innerHTML = `
    <h1>スモールトーク<br>れんしゅうノート</h1>
    <div class="en-sub">Small Talk Practice Notebook</div>
    <p>お友だちと英語でおしゃべりしてみよう！1つの単元で3回やり取りが練習できるよ。🔊お手本の発音を聞いて、🎙️自分の声もろくおんして聞き比べてみよう。</p>
    <div class="textbook-line">3・4年生：Let's Try! 1・2 準拠　／　5・6年生：NEW HORIZON Elementary 5・6（東京書籍・令和6年度版）準拠</div>
  `;
  const btn = el('button','big-btn','はじめる ▶');
  btn.onclick = ()=>{ state.screen='grade'; render(); };
  cover.appendChild(btn);
  wrap.appendChild(cover);
  const note = voiceNote();
  if(note) wrap.appendChild(note);
  return wrap;
}

/* ---------------- GRADE SELECT ---------------- */
function renderGrade(){
  const wrap = document.createElement('div');
  wrap.appendChild(topBar(true, ()=>{state.screen='home'; render();}, false));
  wrap.appendChild(el('div','section-label','STEP 1'));
  wrap.appendChild(el('h1',null,'何年生かな？'));
  wrap.appendChild(el('p','subtitle','What grade are you in?'));
  const grid = el('div','grade-grid');
  [3,4,5,6].forEach(g=>{
    const card = el('div','grade-card');
    card.innerHTML = `<div class="num en">${g}</div><div class="lbl">${g}年生</div><div class="book">${GRADE_INFO[g].book}</div>`;
    card.onclick = ()=>{ state.grade=g; state.screen='topics'; render(); };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- TOPIC(UNIT) SELECT ---------------- */
function renderTopics(){
  const wrap = document.createElement('div');
  wrap.appendChild(topBar(true, ()=>{state.screen='grade'; render();}, true));
  const units = unitsForGrade();
  wrap.appendChild(el('div','section-label',`STEP 2 ・ ${state.grade}年生`));
  wrap.appendChild(el('div','book-badge', GRADE_INFO[state.grade].book));
  wrap.appendChild(el('h1',null,'単元をえらぼう'));
  wrap.appendChild(el('p','subtitle',`スタンプ：${completedCountForGrade()} / ${units.length}`));
  const grid = el('div','topic-grid');
  units.forEach((u, idx)=>{
    const unlocked = isUnitUnlocked(idx);
    const done = state.completed[unitKey(state.grade,u.num)];
    const card = el('div','topic-card'+(unlocked?'':' locked'));
    card.innerHTML = `
      <div class="tape"></div>
      ${done ? '<div class="done-badge">✓</div>' : ''}
      <div class="unum en">UNIT ${u.num}</div>
      <div class="emoji">${u.emoji}</div>
      <div class="t-ja">${u.ja}</div>
      <div class="t-en en">${u.en}</div>
      ${unlocked ? '' : `<div class="lock-note">🔒 前の単元をクリアしよう</div>`}
    `;
    if(unlocked){
      card.onclick = ()=>{
        state.unitIdx=idx; state.step=0; state.chosen=null; state.screen='practice'; render();
      };
    }
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- PRACTICE ---------------- */
function currentUnit(){ return unitsForGrade()[state.unitIdx]; }

function renderPractice(){
  const unit = currentUnit();
  const ex = unit.exchanges[state.step];
  const wrap = document.createElement('div');
  wrap.appendChild(topBar(true, ()=>{state.screen='topics'; render();}, true));
  wrap.appendChild(el('div','section-label',`UNIT ${unit.num} ・ ${unit.emoji} ${unit.ja}`));

  const dots = el('div','progress-dots');
  unit.exchanges.forEach((_,i)=>{
    dots.appendChild(el('div','dot'+(i<state.step?' past':(i===state.step?' active':''))));
  });
  wrap.appendChild(dots);

  const scene = el('div','scene-card');

  const bubble = el('div','partner-bubble');
  bubble.appendChild(el('div','who',`👦👧 ともだち（${state.step+1}/${unit.exchanges.length}往復目）`));
  const enRow = el('div','en-row');
  enRow.appendChild(el('div','en-line en', ex.en));
  enRow.appendChild(speakBtn(ex.en));
  bubble.appendChild(enRow);
  bubble.appendChild(el('div','ja-line', ex.ja));
  scene.appendChild(bubble);

  scene.appendChild(el('div','prompt-note','👉 🔊で発音をきいて、いちばん自分に近い答えをタップしよう'));

  const list = el('div','option-list');
  ex.options.forEach((opt, i)=>{
    const o = el('div','option'+(state.chosen===i?' chosen':''));
    const txt = el('div','txt');
    txt.appendChild(el('div','en-line en', opt.en));
    txt.appendChild(el('div','ja-line', opt.ja));
    o.appendChild(txt);
    o.appendChild(speakBtn(opt.en,'sm'));
    o.onclick = ()=>{ resetMic(); state.chosen=i; render(); };
    list.appendChild(o);
  });
  scene.appendChild(list);

  if(state.chosen!==null){
    const chosenText = ex.options[state.chosen].en;
    const say = el('div','say-banner');
    const txt = el('div','txt');
    txt.appendChild(el('div',null,'🎤 声に出して言ってみよう：'));
    txt.appendChild(el('div','en', '"'+chosenText+'"'));
    say.appendChild(txt);
    say.appendChild(speakBtn(chosenText));
    scene.appendChild(say);

    scene.appendChild(renderMicBox(chosenText));

    const fu = el('div','followup-box');
    fu.appendChild(el('div','lbl','💬 もっと話をつづけるなら…'));
    const fuRow = el('div','en-row');
    fuRow.appendChild(el('div','en-line en', ex.followup.en));
    fuRow.appendChild(speakBtn(ex.followup.en,'sm'));
    fu.appendChild(fuRow);
    fu.appendChild(el('div','ja-line', ex.followup.ja));
    scene.appendChild(fu);
  }

  const note = voiceNote();
  if(note) scene.appendChild(note);

  const navRow = el('div','nav-row');
  const isLast = state.step === unit.exchanges.length - 1;
  const nextBtn = el('button','next-btn', isLast ? 'できた！ 🎉' : 'つぎへ ▶');
  nextBtn.disabled = state.chosen===null;
  nextBtn.onclick = ()=>{
    resetMic();
    if(isLast){
      state.completed[unitKey(state.grade, unit.num)]=true;
      state.screen='complete';
    } else {
      state.step += 1;
      state.chosen = null;
      state.screen='practice';
    }
    render();
  };
  navRow.appendChild(nextBtn);
  scene.appendChild(navRow);

  wrap.appendChild(scene);

  if(VOICE_OK){ setTimeout(()=>{ speak(ex.en); }, 250); }

  return wrap;
}

/* ---------------- COMPLETE ---------------- */
function renderComplete(){
  const unit = currentUnit();
  const units = unitsForGrade();
  const wrap = document.createElement('div');
  wrap.appendChild(topBar(true, ()=>{state.screen='topics'; render();}, true));
  const card = el('div','complete-card');
  card.innerHTML = `
    <div class="stamp-big">★</div>
    <h2 class="en">Well done!</h2>
    <p>UNIT ${unit.num}「${unit.ja}」で3往復のスモールトークができたね！<br>スタンプが増えたよ。 (${completedCountForGrade()} / ${units.length})</p>
  `;
  const row = el('div','btn-row');
  const retry = el('button','big-btn','もう一回れんしゅう');
  retry.onclick = ()=>{ state.step=0; state.chosen=null; state.screen='practice'; render(); };
  row.appendChild(retry);

  const nextIdx = state.unitIdx+1;
  if(nextIdx < units.length){
    const toNext = el('button','ghost-btn','つぎの単元へ ▶');
    toNext.onclick = ()=>{ state.unitIdx=nextIdx; state.step=0; state.chosen=null; state.screen='practice'; render(); };
    row.appendChild(toNext);
  }
  const toTopics = el('button','ghost-btn','単元一覧へ');
  toTopics.onclick = ()=>{ state.screen='topics'; render(); };
  row.appendChild(toTopics);

  card.appendChild(row);
  wrap.appendChild(card);
  return wrap;
}

render();
</script>
</body>
</html>
